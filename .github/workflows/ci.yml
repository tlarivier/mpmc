name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only the test framework is needed; the benchmark submodules (folly in
      # particular) are big and not used here.
      - run: git submodule update --init vendor/test/utest
      - name: tests
        run: make -f Makefile.linux test
      - name: tests under ThreadSanitizer
        run: make -f Makefile.linux tsan
